<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colanta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Colanta por ruta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: primero se elige cuándo (mes o fechas), después qué (Facturado o Pagado), luego la ruta y, en Pagado, el cliente. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#14212B; --muted:#5A6B78; --line:#DCE2E7; --soft:#E8EDF1;
  --accent:#14212B; --accent-ink:#FFFFFF; --bad:#B4322A; --fact:#14212B; --pag:#1E7F5C;
  --r01:#2B6CB0; --r02:#238A6A; --r04:#C98A0A; --r05:#8458C4; --rot:#6B7782;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10171D; --surface:#18222A; --ink:#E7EDF1; --muted:#93A4B1; --line:#2A3943; --soft:#202D36;
    --accent:#E7EDF1; --accent-ink:#10171D; --bad:#F0877F; --fact:#9DB4C6; --pag:#4CC39B;
    --r01:#6AA6E8; --r02:#4CC39B; --r04:#E8B54A; --r05:#B592EC; --rot:#9AA7B1; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera fija: cuándo + qué */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.top .wrap{gap:10px}
.marca{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.marca h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.marca span{font-size:12px;color:var(--muted)}
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.meses::-webkit-scrollbar{display:none}
.mes{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;min-height:40px;white-space:nowrap;text-transform:capitalize}
.mes[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mes.cal[aria-pressed="true"]{background:var(--accent)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.tab[data-v="f"][aria-pressed="true"]{background:var(--fact);color:var(--accent-ink);border-color:transparent}
.tab[data-v="p"][aria-pressed="true"]{background:var(--pag);color:#fff;border-color:transparent}

main .wrap{padding-top:16px}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:block}

/* fechas personalizadas */
.rango{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rango label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rango input{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:46px;width:100%}
.rango .atajos{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.atajos button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* rutas */
.rutas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rc.todas{grid-column:1/-1}
.rc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rc .t{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.rc .dot{width:16px;height:16px;border-radius:50%;flex:none}
.rc .v{font-family:var(--body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.rc .s{font-size:12px;color:var(--muted)}
.mod-f .rc .v{color:var(--fact)}
.mod-p .rc .v{color:var(--pag)}

/* clientes */
.cl{display:flex;flex-wrap:wrap;gap:8px}
.cb{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;text-align:left;min-width:0}
.cb b{display:block;font-size:14px}
.cb span{font-size:12px;color:var(--muted)}
.cb[aria-pressed="true"]{border-color:var(--pag);box-shadow:inset 0 0 0 1px var(--pag)}

/* resumen */
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.res .q{color:var(--muted);font-size:14px}
.res .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,52px);line-height:1.05;margin:2px 0;font-variant-numeric:tabular-nums}
.res .nom{font-family:var(--display);font-weight:700;font-size:clamp(22px,7vw,30px);margin:2px 0;color:var(--pag)}
.res .d{color:var(--muted);font-size:14px}
.mod-p .res .big{color:var(--pag)}

/* listas */
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:10px 2px 2px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:capitalize}
.mh span{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);text-transform:none;font-variant-numeric:tabular-nums}
.dias{display:flex;flex-direction:column;gap:8px}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dia>button,.dia>.row{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px}
.dia .n{font-weight:700;font-size:17px;line-height:1.1}
.dia .n small{display:block;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;margin-top:2px}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.dia .v{font-weight:700;font-variant-numeric:tabular-nums}
.dia .v.neg{color:var(--bad)}
.det{border-top:1px solid var(--line);padding:10px 14px 12px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.det h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.det h3 .t{display:inline-flex;align-items:center;gap:8px}
.dot2{width:10px;height:10px;border-radius:50%;display:inline-block}
.li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.li .nc{color:var(--bad)}
.vacio{color:var(--muted);padding:18px 2px;text-align:center}
.link{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;align-self:flex-start}
.nota{font-size:12.5px;color:var(--muted)}

/* pantalla de código de acceso */
.candado{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.candado[hidden]{display:none}
.candado .caja{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.candado .ico{width:76px;height:76px;border-radius:20px;margin:0 auto;background:#14212B;display:flex;align-items:flex-end;justify-content:center;gap:7px;padding:18px 0}
.candado .ico i{width:11px;border-radius:3px;background:#fff;display:block}
.candado .ico i:nth-child(1){height:18px}.candado .ico i:nth-child(2){height:28px}.candado .ico i:nth-child(3){height:40px;background:#2FB583}
.candado h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0}
.candado p{color:var(--muted);margin:0;font-size:14px}
.candado input{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:20px;text-align:center;letter-spacing:.12em;color:var(--ink);width:100%;text-transform:lowercase}
.candado button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;font-family:var(--display);font-weight:700;font-size:18px}
.candado .err{color:var(--bad);font-size:14px;min-height:20px}
.bloquear{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:6px 0;align-self:flex-start}

/* notas crédito: vista de solo lectura */
.btn-notas{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-family:var(--display);font-weight:700;font-size:18px;width:100%;margin-top:6px}
.notas{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.notas[hidden]{display:none}
.notas .cab{max-width:680px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.notas h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0}
.notas .cab p{margin:4px 0 0;color:var(--muted);font-size:15px}
.cerrar{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:28px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.notas .cuerpo{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.notas .tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.notas .tot .q{color:var(--muted);font-size:14px}
.notas .tot .big{font-family:var(--display);font-weight:700;font-size:clamp(32px,9vw,46px);line-height:1.05;margin:2px 0;color:var(--bad);font-variant-numeric:tabular-nums}
.notas .tot .d{color:var(--muted);font-size:14px}
.notas .mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.notas .mid b{font-size:15px}
.notas .mid span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* versión compacta: la lista de días es una sola tarjeta con líneas finas */
main .wrap{gap:14px;padding-top:12px}
.marca h1{font-size:21px}
.mes{min-height:36px;padding:6px 14px}
.tab{padding:10px;font-size:18px}
.rc{padding:10px 12px}
.rc .t{font-size:19px}
.res{padding:14px 16px}
.res .big{font-size:clamp(30px,9vw,42px)}
.dias{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dia{border:0;border-radius:0;border-bottom:1px solid var(--soft);background:none}
.dia:last-child{border-bottom:0}
.dia>button,.dia>.row{padding:9px 14px;gap:10px;grid-template-columns:64px 1fr auto}
.dia .n{font-size:16px}
.dia .n small{display:inline;margin:0 0 0 5px;font-size:11px}
.bar{height:8px;border-radius:4px}
.dias .mh{margin:0;padding:10px 14px 6px;background:var(--bg);border-bottom:1px solid var(--soft)}
.det{border-top:1px solid var(--soft)}
.notas .dia{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
</style>
</head>
<body>
<div class="notas" id="notas" hidden role="dialog" aria-label="Notas crédito">
  <div class="cab"><div><h2>Notas crédito</h2><p id="notas-sub"></p></div><button class="cerrar" id="notas-x" aria-label="Cerrar">×</button></div>
  <div class="cuerpo" id="notas-cuerpo"></div>
</div>
<div class="top pad">
  <div class="wrap">
    <div class="marca"><h1>Rutas</h1><span id="corte"></span></div>
    <div class="meses" id="meses" role="group" aria-label="Mes"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<main class="pad" id="main">
  <div class="wrap">
    <section id="bloque-rango" hidden>
      <span class="lbl">Elija las fechas</span>
      <div class="rango">
        <label>Desde<input type="date" id="fa"></label>
        <label>Hasta<input type="date" id="fb"></label>
        <div class="atajos" id="atajos"></div>
      </div>
    </section>

    <section id="bloque-ruta">
      <div class="rutas" id="rutas"></div>
    </section>

    <section id="bloque-cli" hidden>
      <span class="lbl">Cliente</span>
      <div class="cl" id="clientes"></div>
    </section>

    <section class="res" id="res" aria-live="polite"></section>

    <section>
      <span class="lbl" id="tit-dias"></span>
      <div class="dias" id="dias"></div>
    </section>

    <p class="nota" id="nota"></p>
    <button class="btn-notas" id="btn-notas">Notas crédito</button>
  </div>
</main>

var NOM={"01":"Filandia","02":"Salento","04":"Popular","05":"Centro","xx":"Sin ruta","ot":"Otro"};
var COL={"01":"var(--r01)","02":"var(--r02)","04":"var(--r04)","05":"var(--r05)","xx":"var(--rot)","ot":"var(--rot)"};
var SEM=["dom","lun","mar","mié","jue","vie","sáb"];
var MESN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

var FACT=[];   /* facturas: {mes,d,iso,r,nc,n,t} */
var PAG=[];    /* pagos:    {mes,d,iso,r,cli,t} */
var MESES=[],CORTE="",MINISO="",MAXISO="";
var st={v:"f",modo:"mes",mes:null,a:"",b:"",ruta:"all",cli:null,abierto:null,hist:false};

function pad(n){return ("0"+n).slice(-2)}
function peso(n){return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CO");}
function mesTxt(k){var p=k.split("-");return MESN[+p[1]-1]+" "+p[0];}
function mes3(k){return MESN[+k.split("-")[1]-1].slice(0,3);}
function semDe(iso){var p=iso.split("-");return SEM[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function fechaCorta(iso){var p=iso.split("-");return +p[2]+" "+MESN[+p[1]-1].slice(0,3);}
function enRango(x){return st.modo==="mes"?x.mes===st.mes:(x.iso>=st.a&&x.iso<=st.b);}
var DISP={"01":"001","04":"003","02":"004","05":"005"};   /* código real de la factura: 001 Filandia, 003 Popular, 004 Salento, 005 Centro */
function etiquetaRuta(k){return k==="all"?"Todas las rutas":((k==="ot"||k==="xx")?NOM[k]:(DISP[k]||k)+" "+NOM[k]);}
function periodoTxt(){
  if(st.modo==="mes")return mesTxt(st.mes);
  return fechaCorta(st.a)+" "+st.a.slice(0,4)+" a "+fechaCorta(st.b)+" "+st.b.slice(0,4);
}

function sumaFact(ruta){var f=0,n=0,c=0,cn=0;FACT.forEach(function(x){if(enRango(x)&&(ruta==="all"||x.r===ruta)){if(x.nc){n+=x.t;cn++}else{f+=x.t;c++}}});return {f:f,n:n,c:c,cn:cn,neto:f-n};}
function sumaPag(ruta){var p=0,c=0;PAG.forEach(function(x){if(enRango(x)&&(ruta==="all"||x.r===ruta)){p+=x.t;c++}});return {p:p,c:c};}
function agrupaMes(items){var g={};items.forEach(function(x){(g[x.mes]=g[x.mes]||[]).push(x)});return g;}

function render(){
  if(!st.mes)return;
  document.getElementById("corte").textContent="";
  document.getElementById("main").className="pad mod-"+st.v;

  /* mes / fechas */
  document.getElementById("meses").innerHTML=MESES.map(function(k){return '<button class="mes" aria-pressed="'+(st.modo==="mes"&&st.mes===k)+'" data-mes="'+k+'">'+mesTxt(k)+'</button>'}).join("")+
    '<button class="mes cal" aria-pressed="'+(st.modo==="rango")+'" data-rango="1">📅 Elegir fechas</button>';
  document.getElementById("tabs").innerHTML='<button class="tab" data-v="f" aria-pressed="'+(st.v==="f")+'">Facturado</button><button class="tab" data-v="p" aria-pressed="'+(st.v==="p")+'">Pagado</button>';
  var br=document.getElementById("bloque-rango");br.hidden=st.modo!=="rango";
  if(st.modo==="rango"){
    var fa=document.getElementById("fa"),fb=document.getElementById("fb");
    fa.min=fb.min=MINISO;fa.max=fb.max=MAXISO;fa.value=st.a;fb.value=st.b;
    document.getElementById("atajos").innerHTML=MESES.slice(0,3).map(function(k){return '<button data-atajo="'+k+'">'+mesTxt(k)+'</button>'}).join("")+'<button data-atajo="todo">Todo lo cargado</button>';
  }

  /* rutas */
  var cliVer=st.v==="p"&&st.cli;
  document.getElementById("bloque-ruta").hidden=false;
  var rutas=["01","04","02","05"];
  if(st.v==="f"){if(FACT.some(function(x){return x.r==="xx"}))rutas.push("xx")}
  else if(PAG.some(function(x){return x.r==="ot"}))rutas.push("ot");
  var h="";
  ["all"].concat(rutas).forEach(function(k){
    var val,sub;
    if(st.v==="f"){var s=sumaFact(k);val=peso(s.neto);sub=s.c+" facturas"+(s.cn?" · "+s.cn+" notas crédito":"")}
    else{var q=sumaPag(k);val=peso(q.p);sub=q.c+" pagos"}
    h+='<button class="rc'+(k==="all"?" todas":"")+'" aria-pressed="'+(st.ruta===k)+'" data-ruta="'+k+'"><span class="t">'+(k==="all"?"":'<span class="dot" style="background:'+COL[k]+'"></span>')+etiquetaRuta(k)+'</span><span class="v">'+val+'</span></button>';
  });
  document.getElementById("rutas").innerHTML=h;

  /* clientes (solo Pagado) */
  var bc=document.getElementById("bloque-cli");bc.hidden=st.v!=="p";
  if(st.v==="p"){
    var cl={};
    PAG.forEach(function(x){if((st.ruta==="all"||x.r===st.ruta)&&(enRango(x)||(st.cli===x.cli&&st.hist))){var c=cl[x.cli]||(cl[x.cli]={t:0,n:0,r:x.r});c.t+=x.t;c.n++}});
    var ks=Object.keys(cl).sort(function(a,b){return cl[b].t-cl[a].t});
    document.getElementById("clientes").innerHTML='<button class="cb" aria-pressed="'+(!st.cli)+'" data-cli=""><b>Todos</b></button>'+
      ks.map(function(k){return '<button class="cb" aria-pressed="'+(st.cli===k)+'" data-cli="'+k+'"><b>'+k+'</b><span>'+peso(cl[k].t)+'</span></button>'}).join("");
  }

  if(st.v==="f")vistaFacturado();else if(st.cli)vistaCliente();else vistaPagado();

  document.getElementById("nota").textContent="";
}

function nDia(iso){return +iso.split("-")[2]}
function etqDia(iso){return '<span class="n">'+(st.modo==="mes"?nDia(iso):fechaCorta(iso))+'<small>'+semDe(iso)+'</small></span>'}

function listaPorMes(porDia,pintaFila,valorDe){
  /* porDia: {iso: objeto}. Si hay más de un mes, agrupa con encabezado por mes. */
  var isos=Object.keys(porDia).sort();
  var g={};isos.forEach(function(i){var m=i.slice(0,7);(g[m]=g[m]||[]).push(i)});
  var ms=Object.keys(g).sort(),out="";
  ms.forEach(function(m){
    if(ms.length>1){var tot=g[m].reduce(function(a,i){return a+valorDe(porDia[i])},0);out+='<div class="mh">'+mesTxt(m)+'<span>'+peso(tot)+'</span></div>'}
    g[m].forEach(function(i){out+=pintaFila(i,porDia[i])});
  });
  return out;
}

function vistaFacturado(){
  var s=sumaFact(st.ruta);
  document.getElementById("res").innerHTML='<div class="q">Facturado · '+etiquetaRuta(st.ruta)+' · '+periodoTxt()+'</div><div class="big">'+peso(s.neto)+'</div><div class="d">'+s.c+(s.c===1?' factura':' facturas')+(s.cn?' menos '+s.cn+(s.cn===1?' nota crédito':' notas crédito')+' ('+peso(s.n)+')':'')+'</div>';
  document.getElementById("tit-dias").textContent="Toque un día para ver las facturas";
  var dias={};
  FACT.forEach(function(x){if(enRango(x)&&(st.ruta==="all"||x.r===st.ruta)){var o=dias[x.iso]||(dias[x.iso]={v:0,rt:{},it:[]});var t=x.nc?-x.t:x.t;o.v+=t;o.rt[x.r]=(o.rt[x.r]||0)+t;o.it.push(x)}});
  var mx=1;Object.keys(dias).forEach(function(i){mx=Math.max(mx,dias[i].v)});
  var out=listaPorMes(dias,function(iso,o){
    var barra="";
    if(st.ruta==="all"){["01","04","02","05","xx"].forEach(function(k){var v=Math.max(0,o.rt[k]||0);if(v)barra+='<i style="width:'+(v/mx*100)+'%;background:'+COL[k]+'"></i>'})}
    else barra='<i style="width:'+(Math.max(0,o.v)/mx*100)+'%;background:'+COL[st.ruta]+'"></i>';
    var ab=st.abierto===iso,det="";
    if(ab){det='<div class="det">';
      ["01","04","02","05","xx"].forEach(function(k){
        var it=o.it.filter(function(x){return x.r===k});if(!it.length)return;
        var sum=it.reduce(function(a,x){return a+(x.nc?-x.t:x.t)},0);
        det+='<div><h3><span class="t"><span class="dot2" style="background:'+COL[k]+'"></span>'+etiquetaRuta(k)+'</span><span>'+peso(sum)+'</span></h3>'+
          it.map(function(x){return '<div class="li"><span class="'+(x.nc?"nc":"")+'">'+(x.nc?"Nota crédito ":"Factura ")+x.n+'</span><span class="'+(x.nc?"nc":"")+'">'+(x.nc?"-":"")+peso(x.t)+'</span></div>'}).join("")+'</div>';
      });
      det+='</div>';}
    return '<div class="dia"><button data-dia="'+iso+'" aria-expanded="'+ab+'">'+etqDia(iso)+'<span class="bar">'+barra+'</span><span class="v'+(o.v<0?" neg":"")+'">'+peso(o.v)+'</span></button>'+det+'</div>';
  },function(o){return o.v});
  document.getElementById("dias").innerHTML=out||'<p class="vacio">No hay facturas cargadas en este periodo.</p>';
}

function vistaPagado(){
  var s=sumaPag(st.ruta);
  document.getElementById("res").innerHTML='<div class="q">Pagado · '+etiquetaRuta(st.ruta)+' · '+periodoTxt()+'</div><div class="big">'+peso(s.p)+'</div><div class="d">'+s.c+(s.c===1?' pago':' pagos')+' de clientes</div>';
  document.getElementById("tit-dias").textContent="Toque un día para ver quién pagó";
  var dias={};
  PAG.forEach(function(x){if(enRango(x)&&(st.ruta==="all"||x.r===st.ruta)){var o=dias[x.iso]||(dias[x.iso]={v:0,it:[]});o.v+=x.t;o.it.push(x)}});
  var mx=1;Object.keys(dias).forEach(function(i){mx=Math.max(mx,dias[i].v)});
  var out=listaPorMes(dias,function(iso,o){
    var ab=st.abierto===iso,det="";
    if(ab)det='<div class="det"><div>'+o.it.map(function(x){return '<div class="li"><span><span class="dot2" style="background:'+COL[x.r]+'"></span> '+x.cli+'</span><span>'+peso(x.t)+'</span></div>'}).join("")+'</div></div>';
    return '<div class="dia"><button data-dia="'+iso+'" aria-expanded="'+ab+'">'+etqDia(iso)+'<span class="bar"><i style="width:'+(o.v/mx*100)+'%;background:var(--pag)"></i></span><span class="v">'+peso(o.v)+'</span></button>'+det+'</div>';
  },function(o){return o.v});
  document.getElementById("dias").innerHTML=out||'<p class="vacio">No hay pagos cargados en este periodo.</p>';
}

function vistaCliente(){
  var todos=PAG.filter(function(x){return x.cli===st.cli});
  var it=todos.sort(function(a,b){return a.iso<b.iso?1:-1});
  var tot=it.reduce(function(a,x){return a+x.t},0),mx=1;it.forEach(function(x){mx=Math.max(mx,x.t)});
  var r=todos.length?todos[0].r:"ot";
    document.getElementById("res").innerHTML='<div class="q">Cliente · '+etiquetaRuta(r)+'</div><div class="nom">'+st.cli+'</div><div class="big">'+peso(tot)+'</div>';
  document.getElementById("tit-dias").textContent="Cuándo pagó";
  var g=agrupaMes(it),ms=Object.keys(g).sort().reverse(),out='';
  ms.forEach(function(m){
    var sub=g[m].reduce(function(a,x){return a+x.t},0);
    out+='<div class="mh">'+mesTxt(m)+'<span>'+peso(sub)+'</span></div>';
    g[m].forEach(function(x){
      out+='<div class="dia"><div class="row"><span class="n">'+nDia(x.iso)+' '+mes3(x.mes)+'<small>'+semDe(x.iso)+'</small></span><span class="bar"><i style="width:'+(x.t/mx*100)+'%;background:var(--pag)"></i></span><span class="v">'+peso(x.t)+'</span></div></div>';
    });
  });
  if(!ms.length)out+='<p class="vacio">Este cliente no tiene pagos en el periodo elegido.</p>';
  document.getElementById("dias").innerHTML=out;
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-v],[data-mes],[data-rango],[data-atajo],[data-ruta],[data-dia],[data-cli],[data-hist]");if(!b)return;
  if(b.dataset.v){st.v=b.dataset.v;st.abierto=null;st.cli=null;st.hist=false}
  else if(b.dataset.mes){st.modo="mes";st.mes=b.dataset.mes;st.manual=true;st.abierto=null}
  else if(b.dataset.rango){
    if(st.modo!=="rango"){st.modo="rango";if(!st.a){var m=st.mes;st.a=m+"-01";var u=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();st.b=m+"-"+pad(u);if(st.b>MAXISO)st.b=MAXISO;if(st.a<MINISO)st.a=MINISO}}
    st.abierto=null}
  else if(b.dataset.atajo){var k=b.dataset.atajo;
    if(k==="todo"){st.a=MINISO;st.b=MAXISO}
    else{var u2=new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();st.a=k+"-01";st.b=k+"-"+pad(u2)}
    st.abierto=null}
  else if(b.dataset.ruta){st.ruta=b.dataset.ruta;st.abierto=null;st.cli=null;st.hist=false}
  else if(b.dataset.cli!==undefined){st.cli=b.dataset.cli||null;st.abierto=null;st.hist=false}
  else if(b.dataset.hist){st.hist=!st.hist}
  else if(b.dataset.dia){st.abierto=st.abierto===b.dataset.dia?null:b.dataset.dia}
  render();
});
document.addEventListener("change",function(e){
  if(e.target.id==="fa"||e.target.id==="fb"){
    var a=document.getElementById("fa").value,b=document.getElementById("fb").value;
    if(a&&b){if(a>b){var t=a;a=b;b=t}st.a=a;st.b=b;st.abierto=null;render()}
  }
});

/* ---------- datos ---------- */
function armarPagos(o){var mapa=o.mapa||{};PAG=[];o.pagos.split("|").forEach(function(s){var p=s.split(",");var f=p[0].split("/");var r=mapa[p[1]];if(!r)return;
  var mes="2026-"+pad(f[1]);PAG.push({mes:mes,d:+f[0],iso:mes+"-"+pad(f[0]),r:r==="ot"?"ot":r,cli:p[1],t:+p[2]});});}
async function abrirBytes(raw,pass,iter){
  var salt=raw.slice(8,16),data=raw.slice(16);
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},base,384));
  var key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,data));
}
function deB64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function descifrar(clave){return JSON.parse(new TextDecoder().decode(await abrirBytes(deB64(CIFRADO),clave,100000)));}
function csv(t){var rows=[],row=[],cur="",q=false;for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;else if(c==","){row.push(cur);cur=""}else if(c=="\n"){row.push(cur);rows.push(row);row=[];cur=""}else if(c!="\r")cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows;}
function codigoRuta(s){s=(s||"").toUpperCase();if(/FILANDIA|FINLANDIA/.test(s))return"01";if(/SALENTO/.test(s))return"02";if(/POPULAR/.test(s))return"04";if(/CENTRO/.test(s))return"05";return"xx";}
function fecha(s){s=(s||"").trim();var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return [m[1],m[2],m[3]];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return [m[3],pad(m[2]),pad(m[1])];return null;}
function juntar(){
  var set={},mn="",mx="",con={};
  FACT.forEach(function(x){con[x.mes]=1});
  FACT.concat(PAG).forEach(function(x){set[x.mes]=1;if(!mn||x.iso<mn)mn=x.iso;if(!mx||x.iso>mx)mx=x.iso});
  /* los botones de mes son los meses con facturas, el más reciente primero; si aún no cargan, los de pagos */
  MESES=Object.keys(Object.keys(con).length?con:set).sort().reverse();MINISO=mn;MAXISO=mx;
  /* el mes más reciente queda elegido solo, mientras la persona no haya tocado otro */
  if(!st.mes||MESES.indexOf(st.mes)<0||!st.manual)st.mes=MESES[0];
  var d=new Date();CORTE=d.getDate()+"/"+(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function cargar(clave){
  var url="https://docs.google.com/spreadsheets/d/e/"+clave+"/pub?gid=0&single=true&output=csv&t="+Date.now();
  return fetch(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(t){
    var seen={};FACT=[];
    csv(t).slice(1).forEach(function(c){
      var f=fecha(c[9])||fecha(c[1]),tot=Math.round(parseFloat(String(c[6]).replace(/[^0-9.\-]/g,"")));
      if(!c[0]||!f||!tot||seen[c[0]])return;seen[c[0]]=1;
      var mes=f[0]+"-"+f[1];
      FACT.push({mes:mes,d:+f[2],iso:mes+"-"+f[2],r:codigoRuta(c[4]),nc:String(c[2]).trim()==="91",n:String(c[0]).replace(/^40111|^401(?=N)/,""),t:tot});
    });
    juntar();render();
  });
}
/* ---------- notas crédito del periodo elegido (solo lectura) ---------- */
function abrirNotas(){
  var rt=(st.ruta==="all"||st.ruta==="ot")?"all":st.ruta;
  var it=FACT.filter(function(x){return x.nc&&enRango(x)&&(rt==="all"||x.r===rt)}).sort(function(a,b){return a.iso<b.iso?-1:a.iso>b.iso?1:0});
  var tot=it.reduce(function(a,x){return a+x.t},0);
  document.getElementById("notas-sub").textContent=(rt==="all"?"Todas las rutas · ":etiquetaRuta(rt)+" · ")+periodoTxt();
  var h='<div class="tot"><div class="q">Total de notas crédito</div><div class="big">-'+peso(tot)+'</div><div class="d">'+it.length+(it.length===1?' nota crédito':' notas crédito')+'</div></div>';
  if(it.length){
    h+='<div class="dia"><div class="det" style="border-top:0">';
    ["01","04","02","05","xx"].forEach(function(k){
      var g=it.filter(function(x){return x.r===k});if(!g.length)return;
      var sub=g.reduce(function(a,x){return a+x.t},0);
      h+='<div><h3><span class="t"><span class="dot2" style="background:'+COL[k]+'"></span>'+etiquetaRuta(k)+'</span><span>-'+peso(sub)+'</span></h3>'+
        g.map(function(x){return '<div class="li"><span class="nc">'+nDia(x.iso)+' '+mes3(x.mes)+' · Nota '+x.n+'</span><span class="nc">-'+peso(x.t)+'</span></div>'}).join("")+'</div>';
    });
    h+='</div></div>';
  }else h+='<p class="vacio">No hay notas crédito en este periodo.</p>';
  document.getElementById("notas-cuerpo").innerHTML=h;
  var n=document.getElementById("notas");n.hidden=false;n.scrollTop=0;document.body.style.overflow="hidden";
}
function cerrarNotas(){document.getElementById("notas").hidden=true;document.body.style.overflow=""}
document.getElementById("btn-notas").addEventListener("click",abrirNotas);
document.getElementById("notas-x").addEventListener("click",cerrarNotas);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!document.getElementById("notas").hidden)cerrarNotas()});
