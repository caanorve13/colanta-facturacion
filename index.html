<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación por ruta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#14212B; --muted:#5A6B78; --line:#DCE2E7; --soft:#E8EDF1;
  --accent:#14212B; --accent-ink:#FFFFFF; --bad:#B4322A;
  --r01:#2B6CB0; --r02:#238A6A; --r04:#C98A0A; --r05:#8458C4; --rxx:#7B8791;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10171D; --surface:#18222A; --ink:#E7EDF1; --muted:#93A4B1; --line:#2A3943; --soft:#202D36;
    --accent:#E7EDF1; --accent-ink:#10171D; --bad:#F0877F;
    --r01:#6AA6E8; --r02:#4CC39B; --r04:#E8B54A; --r05:#B592EC; --rxx:#9AA7B1; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:22px 16px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.lbl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px;display:block}
.fila-botones{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn .dot{width:12px;height:12px;border-radius:50%}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.total{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.total .q{color:var(--muted);font-size:14px}
.total .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,52px);line-height:1.05;margin:2px 0}
.total .d{color:var(--muted);font-size:14px}
.dias{display:flex;flex-direction:column;gap:8px}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dia>button{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:12px}
.dia .n{font-weight:600}
.dia .n small{display:block;font-weight:400;color:var(--muted);font-size:12px;text-transform:uppercase}
.barra{height:12px;border-radius:6px;background:var(--soft);display:flex;overflow:hidden}
.barra i{display:block;height:100%}
.dia .v{font-weight:600;font-variant-numeric:tabular-nums}
.dia .v.neg{color:var(--bad)}
.det{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.det h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.det h3 span.t{display:inline-flex;align-items:center;gap:8px}
.det h3 .dot{width:10px;height:10px;border-radius:50%}
.det .f{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.det .f .nc{color:var(--bad)}
.vacio{color:var(--muted);padding:14px 2px}
.nota{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Facturación por ruta</h1>
    <p class="sub" id="sub"></p>
  </header>

  <section id="bloque-mes" hidden>
    <span class="lbl">Mes</span>
    <div class="fila-botones" id="meses"></div>
  </section>

  <section>
    <span class="lbl">1. Elija la ruta</span>
    <div class="fila-botones" id="rutas"></div>
  </section>

  <section>
    <span class="lbl">2. Elija el periodo</span>
    <div class="fila-botones" id="periodos"></div>
  </section>

  <section class="total" id="total" aria-live="polite"></section>

  <section>
    <span class="lbl">3. Toque un día para ver sus facturas</span>
    <div class="dias" id="dias"></div>
  </section>

  <p class="nota" id="nota"></p>
</div>

<script>
/* Una factura o nota crédito por elemento: fecha,ruta,tipo (f factura, n nota crédito),número,total en pesos.
   Los datos los pone el servidor en cada visita, leyendo la hoja de Google. */
var CORTE="";
var ROWS=[];
var NOM={"01":"Filandia","02":"Salento","04":"Popular","05":"Centro","xx":"Sin ruta"};
var COL={"01":"var(--r01)","02":"var(--r02)","04":"var(--r04)","05":"var(--r05)","xx":"var(--rxx)"};
var ORDEN=["01","02","04","05"];
var SEM=["dom","lun","mar","mié","jue","vie","sáb"];
var MESN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var PER=[["Todo el mes",1,31],["Días 1 a 10",1,10],["Días 11 a 20",11,20],["Días 21 a 31",21,31]];
var MESES=[];
var st={mes:null,ruta:"all",per:0,abierto:null};

function peso(n){return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CO");}
function nombreMes(k){var p=k.split("-");return MESN[+p[1]-1]+" "+p[0];}
function sem(d){var p=st.mes.split("-");return SEM[new Date(+p[0],+p[1]-1,d).getDay()];}
function sel(){var p=PER[st.per];return ROWS.filter(function(x){return x.mes===st.mes&&x.d>=p[1]&&x.d<=p[2]&&(st.ruta==="all"||x.r===st.ruta)});}

function render(){
  if(!MESES.length){document.getElementById("total").innerHTML='<div class="q">Todavía no hay facturas cargadas en la hoja.</div>';return;}
  document.getElementById("sub").textContent=nombreMes(st.mes).replace(/^./,function(c){return c.toUpperCase()})+", datos al "+CORTE+".";
  document.getElementById("bloque-mes").hidden=MESES.length<2;
  document.getElementById("meses").innerHTML=MESES.map(function(k){return '<button class="btn" aria-pressed="'+(st.mes===k)+'" data-mes="'+k+'">'+nombreMes(k)+'</button>';}).join("");

  var h='<button class="btn" aria-pressed="'+(st.ruta==="all")+'" data-ruta="all">Todas</button>';
  ORDEN.forEach(function(k){h+='<button class="btn" aria-pressed="'+(st.ruta===k)+'" data-ruta="'+k+'"><span class="dot" style="background:'+COL[k]+'"></span>'+(k==="xx"?"":k+" ")+NOM[k]+'</button>';});
  document.getElementById("rutas").innerHTML=h;
  document.getElementById("periodos").innerHTML=PER.map(function(p,i){return '<button class="btn" aria-pressed="'+(st.per===i)+'" data-per="'+i+'">'+p[0]+'</button>';}).join("");

  var rows=sel(),vf=0,vn=0,nf=0,nn=0,dias={};
  rows.forEach(function(x){
    if(x.nc){vn+=x.t;nn++}else{vf+=x.t;nf++}
    var o=dias[x.d]||(dias[x.d]={d:x.d,v:0,rt:{},it:[]});
    o.v+=x.nc?-x.t:x.t;o.rt[x.r]=(o.rt[x.r]||0)+(x.nc?-x.t:x.t);o.it.push(x);
  });
  var nombre=st.ruta==="all"?"todas las rutas":(st.ruta==="xx"?"facturas sin ruta":"la ruta "+st.ruta+" "+NOM[st.ruta]);
  document.getElementById("total").innerHTML='<div class="q">Facturado en '+nombre+', '+PER[st.per][0].toLowerCase()+'</div><div class="big">'+peso(vf-vn)+'</div><div class="d">'+nf+' facturas'+(nn?' menos '+nn+' notas crédito ('+peso(vn)+')':'')+'</div>';

  var lista=Object.keys(dias).map(Number).sort(function(a,b){return a-b}),mx=1;
  lista.forEach(function(d){mx=Math.max(mx,dias[d].v)});
  var out="";
  lista.forEach(function(d){
    var o=dias[d],ab=st.abierto===d,barra="";
    if(st.ruta==="all"){ORDEN.forEach(function(k){var v=Math.max(0,o.rt[k]||0);if(v)barra+='<i style="width:'+(v/mx*100)+'%;background:'+COL[k]+'"></i>'});}
    else barra='<i style="width:'+(Math.max(0,o.v)/mx*100)+'%;background:'+COL[st.ruta]+'"></i>';
    out+='<div class="dia"><button data-dia="'+d+'" aria-expanded="'+ab+'"><span class="n">'+d+'<small>'+sem(d)+'</small></span><span class="barra">'+barra+'</span><span class="v'+(o.v<0?" neg":"")+'">'+peso(o.v)+'</span></button>';
    if(ab){
      out+='<div class="det">';
      ORDEN.forEach(function(k){
        var it=o.it.filter(function(x){return x.r===k});if(!it.length)return;
        var s=it.reduce(function(a,x){return a+(x.nc?-x.t:x.t)},0);
        out+='<div><h3><span class="t"><span class="dot" style="background:'+COL[k]+'"></span>'+(k==="xx"?"":k+" ")+NOM[k]+'</span><span>'+peso(s)+'</span></h3>'+
          it.map(function(x){return '<div class="f"><span class="'+(x.nc?"nc":"")+'">'+(x.nc?"Nota crédito ":"Factura ")+x.n+'</span><span class="'+(x.nc?"nc":"")+'">'+(x.nc?"-":"")+peso(x.t)+'</span></div>'}).join("")+'</div>';
      });
      out+='</div>';
    }
    out+='</div>';
  });
  document.getElementById("dias").innerHTML=out||'<p class="vacio">No hay facturas cargadas para esta selección.</p>';
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-mes],[data-ruta],[data-per],[data-dia]");if(!b)return;
  if(b.dataset.mes){st.mes=b.dataset.mes;st.abierto=null}
  else if(b.dataset.ruta){st.ruta=b.dataset.ruta;st.abierto=null}
  else if(b.dataset.per){st.per=+b.dataset.per;st.abierto=null}
  else{var d=+b.dataset.dia;st.abierto=st.abierto===d?null:d}
  render();
});
document.getElementById("nota").textContent="Cada valor es el total a pagar de la factura electrónica de Colanta y la ruta sale del campo «Entregado a». Un día que no aparece no tiene facturas leídas del correo. La página se actualiza sola con la hoja.";

/* ---- lectura de la hoja publicada ---- */
function csv(t){var rows=[],row=[],cur="",q=false;for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;else if(c==","){row.push(cur);cur=""}else if(c=="\n"){row.push(cur);rows.push(row);row=[];cur=""}else if(c!="\r")cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows;}
function codigoRuta(s){s=(s||"").toUpperCase();if(/FILANDIA|FINLANDIA/.test(s))return"01";if(/SALENTO/.test(s))return"02";if(/POPULAR/.test(s))return"04";if(/CENTRO/.test(s))return"05";return"xx";}
function fecha(s){s=(s||"").trim();var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return [m[1],m[2],m[3]];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return [m[3],("0"+m[2]).slice(-2),("0"+m[1]).slice(-2)];return null;}
function cargar(clave){
  var url="https://docs.google.com/spreadsheets/d/e/"+clave+"/pub?gid=0&single=true&output=csv&t="+Date.now();
  return fetch(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(t){
    var seen={};ROWS=[];
    csv(t).slice(1).forEach(function(c){
      var f=fecha(c[1]),tot=Math.round(parseFloat(String(c[6]).replace(/[^0-9.\-]/g,"")));
      if(!c[0]||!f||!tot||seen[c[0]])return;seen[c[0]]=1;
      ROWS.push({mes:f[0]+"-"+f[1],y:+f[0],m:+f[1],d:+f[2],r:codigoRuta(c[4]),nc:String(c[2]).trim()==="91",n:String(c[0]).replace(/^40111|^401(?=N)/,""),t:tot});
    });
    MESES=[];ROWS.forEach(function(x){if(MESES.indexOf(x.mes)<0)MESES.push(x.mes)});MESES.sort();
    if(ROWS.some(function(x){return x.r==="xx"})&&ORDEN.indexOf("xx")<0)ORDEN.push("xx");
    if(!st.mes||MESES.indexOf(st.mes)<0)st.mes=MESES[MESES.length-1];
    var d=new Date();CORTE=d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    render();
  });
}
var clave=null;
try{var h=location.hash.match(/e=([\w\-]+)/);if(h){clave=h[1];localStorage.setItem("clave",clave);history.replaceState(null,"",location.pathname)}else clave=localStorage.getItem("clave")}catch(e){var h2=location.hash.match(/e=([\w\-]+)/);if(h2)clave=h2[1]}
if(!clave){document.getElementById("total").innerHTML='<div class="q">Abra la página con el enlace completo que incluye la clave de los datos.</div>';}
else{cargar(clave).catch(function(){document.getElementById("total").innerHTML='<div class="q">No pude leer los datos. Revise que la hoja siga publicada.</div>'});
  setInterval(function(){cargar(clave).catch(function(){})},300000);}
</script>
</body>
</html>
